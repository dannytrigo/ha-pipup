start_pipup:
  target:
    entity:
      integration: androidtv
      domain: media_player
setup_pipup:
  target:
    entity:
      integration: androidtv
      domain: media_player
pipup:
  fields:
    entity_id:
      name: Android TV
      description: "The Android TV entity ID to control (optional)"
      example: "media_player.android_tv"
      required: false
      selector:
        entity:
          integration: androidtv
          domain: media_player
    host:
      name: Host
      description: IP address of the Android TV device, optionally with port (alternative to entity selection). Defaults to port 7979 if not specified.
      required: false
      example: "192.168.1.100:7979"
      selector:
        text:
    duration:
      name: Duration
      description: The duration of the pop-up in seconds
      required: false
      example: 20
      selector:
        number:
          min: 1
    position:
      name: Position
      description: The position on the screen
      required: false
      example: Top Right
      selector:
        select:
          options:
            - label: Top Right
              value: "0"
            - label: Top Left
              value: "1"
            - label: Bottom Right
              value: "2"
            - label: Bottom Left
              value: "3"
            - label: Centre
              value: "4"
    title:
      name: Title
      description: The title of the pop-up notification
      required: false
      example: Camera Alert
      selector:
        text:
    title_colour:
      name: Title Colour
      description: The colour of the title
      required: false
      example: "#0066cc"
      selector:
        color_rgb:
    title_size:
      name: Title Size
      description: The size of the title
      required: false
      example: 20
      selector:
        number:
          min: 1
    message:
      name: Message
      description: The message in the pop-up
      required: false
      example: Someone is at the door
      selector:
        text:
    message_colour:
      name: Message Colour
      description: The colour of the message
      required: false
      example: "#000000"
      selector:
        color_rgb:
    message_size:
      name: Message Size
      description: The size of the message
      required: false
      example: 14
      selector:
        number:
          min: 1
    background_colour:
      name: Background Colour
      description: The colour of the background
      required: false
      example: "#ffffff"
      selector:
        color_rgb:
    media_image:
      name: Image URI
      description: The URI of an image to display
      required: false
      example: https://mir-s3-cdn-cf.behance.net/project_modules/max_1200/cfcc3137009463.5731d08bd66a1.png
      selector:
        text:
    media_video:
      name: Video URI
      description: The URI of a video to display
      required: false
      example: https://abc.com/video.mp4
      selector:
        text:
    media_web:
      name: Web URI
      description: The URI of a web resource
      required: false
      example: https://abc.com/info.html
      selector:
        text:
    media_width:
      name: Media Width
      description: The width of the media
      required: false
      example: 480
      selector:
        number:
          min: 1
    media_height:
      name: Media Height
      description: The height of the media
      required: false
      example: 640
      selector:
        number:
          min: 1
    image_filename:
      name: Image Filename
      description: The local path to an image to include in the notification
      required: false
      example: /media/cams/doorbell.jpg
      selector:
        text:
tvoverlay:
  fields:
    entity_id:
      name: Android TV
      description: "The Android TV entity ID to control (optional)"
      example: "media_player.android_tv"
      required: false
      selector:
        entity:
          integration: androidtv
          domain: media_player
    host:
      name: Host
      description: IP address of the Android TV device, optionally with port (alternative to entity selection). Defaults to port 5001 if not specified.
      required: false
      example: "192.168.1.100:5001"
      selector:
        text:
    id:
      name: ID
      description: A unique identifier for the notification. Can be used to edit a notification while in queue or being displayed.
      required: false
      example: "cam1_motion"
      selector:
        text:
    title:
      name: Title
      description: The main text of the notification
      required: false
      example: Camera 1
      selector:
        text:
    message:
      name: Message
      description: The secondary text of the notification
      required: false
      example: Motion detected at front door
      selector:
        text:
    source:
      name: Source
      description: Extra info text for the notification
      required: false
      example: Front Door Camera
      selector:
        text:
    image:
      name: Image
      description: Image to display. Can be MDI icon (mdi:alert), image URL, or Base64 encoded bitmap
      required: false
      example: https://example.com/camera.jpg
      selector:
        text:
    video:
      name: Video
      description: Video URL to display. Supports RTSP, HLS, DASH, and SmoothStreaming
      required: false
      example: rtsp://10.10.10.118:8554/front_door
      selector:
        text:
    large_icon:
      name: Large Icon
      description: Large icon to display. Can be MDI icon (mdi:camera), image URL, or Base64 encoded bitmap
      required: false
      example: mdi:camera
      selector:
        text:
    small_icon:
      name: Small Icon
      description: Small icon to display. Can be MDI icon (mdi:bell), image URL, or Base64 encoded bitmap
      required: false
      example: mdi:bell
      selector:
        text:
    small_icon_color:
      name: Small Icon Color
      description: Color tint for the small icon (hex color with or without #)
      required: false
      example: "#FF5722"
      selector:
        text:
    corner:
      name: Corner
      description: Position of the notification on screen
      required: false
      example: bottom_end
      selector:
        select:
          options:
            - label: Bottom Right
              value: bottom_end
            - label: Bottom Left
              value: bottom_start
            - label: Top Right
              value: top_end
            - label: Top Left
              value: top_start
    duration:
      name: Duration
      description: Duration that the notification will stay visible in seconds
      required: false
      example: 20
      selector:
        number:
          min: 1
